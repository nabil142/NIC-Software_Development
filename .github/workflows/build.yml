name: Build Flutter iOS & Android

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS IPA and Android APK
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        working-directory: ecosim_flutter
        run: flutter pub get

      - name: Build Android APK
        working-directory: ecosim_flutter
        run: flutter build apk --release

      - name: Build iOS IPA (No Code Signing)
        working-directory: ecosim_flutter
        # We build ios without code signing so it generates an IPA that can be sideloaded (with dev account or tools)
        run: |
          flutter build ios --release --no-codesign
          cd build/ios/iphoneos
          mkdir Payload
          cp -r Runner.app Payload/
          zip -r app.ipa Payload
          
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: ecosim-android-apk
          path: ecosim_flutter/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: ecosim-ios-ipa
          path: ecosim_flutter/build/ios/iphoneos/app.ipa
