name: Build Flutter iOS & Android

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS IPA and Android APK
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        working-directory: envitor_flutter
        run: flutter pub get

      - name: Build Android APK
        working-directory: envitor_flutter
        run: flutter build apk --release

      - name: Install Apple Certificate
        if: github.ref == 'refs/heads/main'
        uses: apple-actions/import-codesign-certs@v2
        with:
          p12-file-base64: ${{ secrets.IOS_P12_BASE64 }}
          p12-password: ${{ secrets.IOS_P12_PASSWORD }}

      - name: Install Provisioning Profile
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "${{ secrets.IOS_PROVISION_BASE64 }}" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision

      - name: Debug Keychain Identities
        run: security find-identity -v -p codesigning

      - name: Setup Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build iOS IPA (Release)
        working-directory: envitor_flutter
        run: flutter build ipa --release --export-options-plist=ios/ExportOptions.plist
          
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: envitor-android-apk
          path: envitor_flutter/build/app/outputs/flutter-apk/*.apk

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: envitor-ios-ipa
          path: envitor_flutter/build/ios/ipa/*.ipa

      - name: Upload to TestFlight
        if: github.ref == 'refs/heads/main'
        working-directory: envitor_flutter
        run: |
          mkdir -p ~/.appstoreconnect/private_keys/
          echo "${{ secrets.APPSTORE_P8_BASE64 }}" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APPSTORE_KEY_ID }}.p8
          xcrun altool --upload-app -f build/ios/ipa/*.ipa -t ios --apiKey "${{ secrets.APPSTORE_KEY_ID }}" --apiIssuer "${{ secrets.APPSTORE_ISSUER_ID }}"
