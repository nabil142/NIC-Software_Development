version: '3.8'

services:
  # Local PostgreSQL database for local development and testing
  postgres:
    image: postgres:15-alpine
    container_name: envitor_postgres
    restart: always
    environment:
      POSTGRES_USER: envitor_user
      POSTGRES_PASSWORD: envitor_secure_password
      POSTGRES_DB: envitor_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
